<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="weatherClimb">
<title>Ветер по высотам</title>
<meta name="theme-color" content="#1d3557">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone column; place bar, scene card, weather facts, then the height table */
:root{
  --bg:#eef2f6; --surface:#ffffff; --fg:#14202e; --muted:#5b6b7d; --line:#d6dee7;
  --accent:#1f6fd1; --accent-ink:#ffffff; --star:#f2a900; --warn-bg:#fff4d6; --warn-fg:#6b4d00;
  --display:"Unbounded", "Manrope", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c131c; --surface:#151f2b; --fg:#e6edf5; --muted:#93a3b5; --line:#263445;
  --accent:#5aa2ff; --accent-ink:#071423; --star:#ffc53d; --warn-bg:#3a2e0c; --warn-fg:#f3dc96; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131c; --surface:#151f2b; --fg:#e6edf5; --muted:#93a3b5; --line:#263445;
  --accent:#5aa2ff; --accent-ink:#071423; --star:#ffc53d; --warn-bg:#3a2e0c; --warn-fg:#f3dc96; color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
:root{--gut:12px}
body{font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(var(--gut), env(safe-area-inset-left, 0px));padding-right:max(var(--gut), env(safe-area-inset-right, 0px));
  padding-top:max(14px, calc(env(safe-area-inset-top, 0px) + 8px));padding-bottom:max(24px, env(safe-area-inset-bottom, 0px))}
.credit{font-size:10px;text-align:center;opacity:.6}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 6px);z-index:5;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;
  font-size:20px;font-weight:700;color:var(--accent);opacity:0;transform:translateY(-50px);pointer-events:none}
.ptr.spin span{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.credit a{color:var(--muted)}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggles{display:flex;gap:8px;flex-shrink:0}
h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-size:15px;font-weight:500;margin:6px 0 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.place{display:flex;gap:6px;align-items:center;min-width:0;flex:1}
.place-name{font:inherit;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;border:0;background:transparent;color:inherit;padding:4px 2px;text-align:left}
.place-name::after{content:" ▾";font-size:12px;color:var(--muted)}
.star{border:0;background:transparent;font-size:24px;line-height:1;padding:2px 4px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--star)}
.actions{display:flex;gap:6px}
.search{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.search-row{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--fg)}
.results{display:flex;flex-direction:column;gap:2px}
.results button{text-align:left;border:0;background:transparent;padding:7px 6px;border-radius:8px}
.results button:hover{background:var(--bg)}
.results small{color:var(--muted)}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chip.fav::before{content:"★ ";color:var(--star)}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;flex:none;align-self:center}
.note{font-size:13px;color:var(--muted);margin:0}
.banner{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:8px 12px;font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:7px 4px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.seg button small{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.85}
.scene-wrap{position:relative;overflow:hidden;background:#24384f;margin-inline:calc(-1*var(--gut))}
canvas{display:block;width:100%;touch-action:manipulation}
.scene-caption{position:absolute;left:0;top:0;padding:12px 40px 34px 14px;color:#fff;pointer-events:none;
  text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 10px rgba(0,0,0,.35);
  background:radial-gradient(120% 100% at 0 0, rgba(8,18,34,.5), rgba(8,18,34,.28) 55%, rgba(8,18,34,0) 80%)}
.scene-caption .t{font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.scene-caption .c{font-size:13px;font-weight:700;margin-top:4px}
.scene-caption .p{font-size:12px;font-weight:600;opacity:.9}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:1px}
.stat .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--mono);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .s{font-size:12px;line-height:1.3;color:var(--muted)}
.uv-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:1px}
.levels{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.levels table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.levels th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.levels td{padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:14px}
.levels tr:last-child td{border-bottom:0}
.levels tbody tr{cursor:pointer}
.levels tbody tr[aria-selected="true"]{background:color-mix(in srgb, var(--accent) 14%, transparent)}
.spd{display:inline-block;min-width:44px;text-align:center;border-radius:999px;padding:1px 8px;color:#0d1b2a;font-weight:700}
.arrow{display:inline-block;width:14px;text-align:center}
.est{color:var(--muted);font-size:12px}
.hours{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*var(--gut));padding:2px var(--gut);scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.hours::-webkit-scrollbar{display:none}
.hours button{flex:none;width:58px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:center}
.hours button .hh{font-family:var(--mono);font-size:11px;color:var(--muted)}
.hours button .ic{font-size:18px;line-height:1.2}
.hours button .tt{font-weight:700;font-size:14px}
.hours button .ww{font-family:var(--mono);font-size:10px;color:var(--muted)}
.hours button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hours button[aria-selected="true"] .hh,.hours button[aria-selected="true"] .ww{color:inherit;opacity:.85}
.scroller{mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:24px}
.unit{display:flex;gap:4px}
.unit button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.unit button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
footer{font-size:12px;color:var(--muted)}
footer a{color:var(--accent)}
</style>

<div class="ptr" id="ptr" aria-hidden="true"><span>↻</span></div>
<div class="app">
  <header>
    <h1 data-i18n="title">Ветер по высотам</h1>
    <div class="toggles">
      <div class="unit" role="group" aria-label="Язык">
        <button id="l-ru" aria-pressed="true">RU</button>
        <button id="l-en" aria-pressed="false">EN</button>
      </div>
      <div class="unit" role="group" data-i18n-aria="units" aria-label="Единицы скорости">
        <button id="u-ms" aria-pressed="true" data-i18n="ms">м/с</button>
        <button id="u-kmh" aria-pressed="false" data-i18n="kmh">км/ч</button>
      </div>
    </div>
  </header>

  <div class="row">
    <div class="place">
      <button class="star" id="fav-btn" aria-pressed="false" aria-label="Добавить место в избранное">☆</button>
      <button class="place-name" id="place-name" aria-expanded="false">Москва</button>
    </div>
    <div class="actions">
      <button class="btn" id="geo-btn">📍 Где я</button>
    </div>
  </div>

  <div class="search" id="search" hidden>
    <form class="search-row" id="search-form">
      <input id="search-input" type="search" data-i18n-ph="searchPh" placeholder="Город, посёлок, курорт" autocomplete="off" enterkeyhint="search">
    </form>
    <div class="results" id="results"></div>
  </div>

  <div class="scroller" id="favs" data-i18n-aria="favsAria" aria-label="Избранные места"></div>

  <div class="banner" id="banner" hidden></div>

  <div class="scroller" id="days"></div>
  <div class="hours" id="hours" role="listbox" data-i18n-aria="hour" aria-label="Час"></div>

  <div class="scene-wrap">
    <canvas id="scene" data-i18n-aria="sceneAria" aria-label="Вышка с ветром на разных высотах"></canvas>
    <div class="scene-caption"><div class="t" id="cap-temp">—</div><div class="c" id="cap-cond"></div><div class="p" id="cap-feel"></div><div class="p" id="cap-pop"></div><div class="p" id="cap-sun"></div></div>
  </div>


  <div class="facts">
    <div class="stat"><div class="k" data-i18n="rise">Восход</div><div class="v" id="f-rise">—</div><div class="s" id="f-daylen"></div></div>
    <div class="stat"><div class="k" data-i18n="set">Закат</div><div class="v" id="f-set">—</div><div class="s" id="f-setnote"></div></div>
    <div class="stat"><div class="k" data-i18n="uv">УФ-индекс</div><div class="v" id="f-uv">—</div><div class="s" id="f-uvtxt"></div></div>
    <div class="stat"><div class="k" data-i18n="prec">Осадки</div><div class="v" id="f-prec">—</div><div class="s" id="f-cloud"></div></div>
    <div class="stat"><div class="k" data-i18n="gust">Порывы</div><div class="v" id="f-gust">—</div><div class="s" data-i18n="at10">на 10 м</div></div>
    <div class="stat"><div class="k" data-i18n="water">Вода</div><div class="v" id="f-water">—</div><div class="s" id="f-watertxt"></div></div>
  </div>

  <h2 data-i18n="h2">Ветер на каждой высоте</h2>
  <div class="levels">
    <table>
      <thead><tr><th data-i18n="thH">Высота</th><th data-i18n="thV">Скорость</th><th data-i18n="thD">Откуда дует</th></tr></thead>
      <tbody id="levels"></tbody>
    </table>
  </div>

  <footer class="credit"><a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></footer>
</div>

<script>
(() => {
const LEVELS = [
  {h:2, label:'у земли'}, {h:10, label:'10 м / 33 ft'}, {h:20, label:'20 м / 66 ft'}, {h:40, label:'40 м / 131 ft'},
  {h:80, label:'80 м / 262 ft'}, {h:120, label:'120 м / 394 ft'}
];
// ---------- languages ----------
const I18N = {
  title: ['Ветер по высотам', 'Wind by height'], units: ['Единицы скорости', 'Speed units'],
  ms: ['м/с', 'm/s'], kmh: ['км/ч', 'km/h'], m: ['м', 'm'],
  favAdd: ['Добавить в избранное', 'Add to favourites'], favDel: ['Убрать из избранного', 'Remove from favourites'], favs: ['Избранное', 'Favourites'],
  geo: ['📍 Где я', '📍 Locate me'], geoBusy: ['📍 Ищу…', '📍 Locating…'], find: ['Найти', 'Search'],
  searchPh: ['Город, посёлок, курорт', 'City, town, resort'], favsAria: ['Избранные места', 'Favourite places'],
  hour: ['Час', 'Hour'], sceneAria: ['Вышка с ветром на разных высотах', 'Tower with the wind at each height'], terrain: ['Местность', 'Terrain'],
  rise: ['Восход', 'Sunrise'], set: ['Закат', 'Sunset'], uv: ['УФ-индекс', 'UV index'], prec: ['Осадки', 'Precipitation'],
  gust: ['Порывы', 'Gusts'], at10: ['на 10 м', 'at 10 m'], water: ['Вода', 'Water'],
  h2: ['Ветер на каждой высоте', 'Wind at each height'], thH: ['Высота', 'Height'], thV: ['Скорость', 'Speed'], thD: ['Откуда дует', 'From'],
  modelNote: ['Модель даёт ветер на 10, 80 и 120 м. Значения у земли, на 20 и 40 м рассчитаны по профилю ветра между ними и помечены знаком ≈.',
    'The model gives wind at 10, 80 and 120 m. Values near the ground and at 20 and 40 m are estimated from the wind profile between them and marked with ≈.'],
  footer: ['Прогноз, УФ и температура моря: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>. Высоты на вышке показаны в сжатом масштабе, чтобы нижние уровни не слипались.',
    'Forecast, UV and sea temperature: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>. Heights on the tower are drawn on a compressed scale so the low levels do not crowd together.'],
  slots: [['Утро', 'День', 'Вечер'], ['Morning', 'Day', 'Evening']],
  dirs: [['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'], ['N','NE','E','SE','S','SW','W','NW']],
  week: [['вс','пн','вт','ср','чт','пт','сб'], ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']],
  terrains: [{auto:'Авто', forest:'Лес', mountains:'Горы', sea:'Море', city:'Город', field:'Поле'}, {auto:'Auto', forest:'Forest', mountains:'Mountains', sea:'Sea', city:'City', field:'Field'}],
  terrainLow: [{forest:'лес', mountains:'горы', sea:'море', city:'город', field:'поле'}, {forest:'forest', mountains:'mountains', sea:'sea', city:'city', field:'field'}],
  ground: ['у земли', 'ground'], today: ['Сегодня', 'Today'], tomorrow: ['Завтра', 'Tomorrow'],
  unitNote: [u => 'Скорость на вышке в ' + u + ', стрелка показывает, куда дует ветер (север вверху).', u => 'Tower speeds in ' + u + '; the arrow shows where the wind blows to (north is up).'],
  feel: ['Ощущается как ', 'Feels like '], h: [' ч ', ' h '], min: [' мин', ' min'], day: ['день ', 'daylight '],
  notUp: ['солнце ещё не встало', 'the sun is not up yet'], down: ['солнце уже село', 'the sun has set'], inT: ['через ', 'in '],
  popTxt: ['Вероятность осадков', 'Chance of precipitation'],
  max: ['макс. ', 'max '], noData: ['нет данных', 'no data'], mm: [' мм', ' mm'], cloud: ['облачность ', 'cloud cover '],
  sample: ['пример', 'sample'], seaNear: ['море рядом', 'sea nearby'], noSea: ['моря рядом нет', 'no sea nearby'],
  uvL: [['низкий', 'средний, нужна защита', 'высокий', 'очень высокий', 'экстремальный'], ['low', 'moderate, use protection', 'high', 'very high', 'extreme']],
  searching: ['Ищу…', 'Searching…'], notFound: ['Ничего не нашлось. Попробуйте другое написание.', 'Nothing found. Try another spelling.'],
  noSearch: ['Поиск сейчас недоступен: нет связи с сервером.', 'Search is unavailable: no connection to the server.'],
  noGeo: ['Это устройство не сообщает своё место. Найдите город через поиск.', 'This device does not share its location. Find your town with search.'],
  geoFail: ['Не получилось узнать, где вы. Разрешите доступ к геопозиции для этой страницы или найдите город через поиск.', 'Could not get your location. Allow location access for this page or find your town with search.'],
  myPlace: ['Моё место', 'My location'],
  demo: ['Нет связи с сервером прогноза, поэтому показан пример погоды.', 'No connection to the forecast server, so sample weather is shown.']
};
const WMO_EN = {'Ясно':'Clear', 'Преимущественно ясно':'Mostly clear', 'Переменная облачность':'Partly cloudy', 'Пасмурно':'Overcast', 'Туман':'Fog',
  'Морось':'Drizzle', 'Ледяная морось':'Freezing drizzle', 'Небольшой дождь':'Light rain', 'Дождь':'Rain', 'Сильный дождь':'Heavy rain',
  'Ледяной дождь':'Freezing rain', 'Небольшой снег':'Light snow', 'Снег':'Snow', 'Сильный снег':'Heavy snow', 'Снежная крупа':'Snow grains',
  'Сильный ливень':'Violent showers', 'Ливень':'Showers', 'Снегопад':'Snow showers', 'Гроза':'Thunderstorm', 'Гроза с градом':'Thunderstorm with hail', 'Облачно':'Cloudy'};
let LANG = (() => { try { const v = localStorage.getItem('veter.lang'); if (v) return JSON.parse(v); } catch(e){} return (navigator.language || 'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en'; })();
const say = k => I18N[k][LANG === 'en' ? 1 : 0];
function applyLang(){
  document.documentElement.lang = LANG; document.title = say('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = say(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = say(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = say(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', say(el.dataset.i18nAria)); });
  document.getElementById('l-ru').setAttribute('aria-pressed', String(LANG === 'ru'));
  document.getElementById('l-en').setAttribute('aria-pressed', String(LANG === 'en'));
  document.getElementById('geo-btn').textContent = say('geo');
}
const TERRAINS = ['auto','forest','mountains','sea','city','field'];
const DEFAULT_PLACE = {name:'Москва', lat:55.7558, lon:37.6173, pop:12000000};

const store = {
  get(k, d){ try { const v = localStorage.getItem('veter.' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('veter.' + k, JSON.stringify(v)); } catch(e){} }
};

const state = {
  place: store.get('place', DEFAULT_PLACE), favs: store.get('favs', []), unit: store.get('unit2', 'kmh'),
  terrainPick: new URLSearchParams(location.search).get('terrain') || 'auto', autoTerrain: 'forest', terrainWhy: '',
  data:null, marine:null, demo:false, day:0, hour:null, sel:1
};

function placeNow(){
  // local time at the chosen place, from the forecast's UTC offset
  const off = state.data && state.data.utc_offset_seconds != null ? state.data.utc_offset_seconds : -new Date().getTimezoneOffset()*60;
  const d = new Date(Date.now() + off*1000);
  return {hour: d.getUTCHours() + d.getUTCMinutes()/60, date: d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate())};
}
function defaultHour(){ return Math.floor(placeNow().hour); }
const pad = n => String(n).padStart(2,'0');
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const $ = id => document.getElementById(id);

// ---------- weather codes ----------
function wmo(code){
  const c = code|0;
  if (c === 0) return {kind:'clear', text:'Ясно'};
  if (c === 1) return {kind:'clear', text:'Преимущественно ясно'};
  if (c === 2) return {kind:'cloudy', text:'Переменная облачность'};
  if (c === 3) return {kind:'overcast', text:'Пасмурно'};
  if (c === 45 || c === 48) return {kind:'fog', text:'Туман'};
  if (c >= 51 && c <= 55) return {kind:'drizzle', text:'Морось'};
  if (c === 56 || c === 57) return {kind:'drizzle', text:'Ледяная морось'};
  if (c === 61) return {kind:'rain', text:'Небольшой дождь'};
  if (c === 63) return {kind:'rain', text:'Дождь'};
  if (c === 65) return {kind:'rain', text:'Сильный дождь'};
  if (c === 66 || c === 67) return {kind:'rain', text:'Ледяной дождь'};
  if (c === 71) return {kind:'snow', text:'Небольшой снег'};
  if (c === 73) return {kind:'snow', text:'Снег'};
  if (c === 75) return {kind:'snow', text:'Сильный снег'};
  if (c === 77) return {kind:'snow', text:'Снежная крупа'};
  if (c >= 80 && c <= 82) return {kind:'rain', text: c === 82 ? 'Сильный ливень' : 'Ливень'};
  if (c === 85 || c === 86) return {kind:'snow', text:'Снегопад'};
  if (c === 95) return {kind:'storm', text:'Гроза'};
  if (c === 96 || c === 99) return {kind:'storm', text:'Гроза с градом'};
  return {kind:'cloudy', text:'Облачно'};
}

// ---------- data ----------
const HOURLY = ['temperature_2m','apparent_temperature','precipitation','precipitation_probability','weather_code','cloud_cover','wind_gusts_10m','uv_index',
  'wind_speed_10m','wind_speed_80m','wind_speed_120m','wind_speed_180m',
  'wind_direction_10m','wind_direction_80m','wind_direction_120m','wind_direction_180m'];

async function getJSON(url, ms){
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), ms || 8000);
  try { const r = await fetch(url, {signal: ctrl.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(to); }
}

async function loadAll(place){
  const f = 'https://api.open-meteo.com/v1/forecast?latitude=' + place.lat + '&longitude=' + place.lon +
    '&hourly=' + HOURLY.join(',') + '&daily=sunrise,sunset,uv_index_max&wind_speed_unit=ms&timezone=auto&forecast_days=3';
  // the cell right at the coast can count as land, so also try points 15 km around
  const mk = 0.14, mkl = mk/Math.max(0.2, Math.cos(place.lat*Math.PI/180));
  const mLat = [0,mk,-mk,0,0].map(d => (place.lat + d).toFixed(4)).join(','), mLon = [0,0,0,mkl,-mkl].map(d => (place.lon + d).toFixed(4)).join(',');
  const m = 'https://marine-api.open-meteo.com/v1/marine?latitude=' + mLat + '&longitude=' + mLon +
    '&hourly=sea_surface_temperature,wave_height&timezone=auto&forecast_days=3';
  const k = 0.12, kl = k/Math.max(0.2, Math.cos(place.lat*Math.PI/180));
  const lats = [0,k,-k,0,0,k,k,-k,-k].map(d => (place.lat + d).toFixed(4));
  const lons = [0,0,0,kl,-kl,kl,-kl,kl,-kl].map(d => (place.lon + d).toFixed(4));
  const e = 'https://api.open-meteo.com/v1/elevation?latitude=' + lats.join(',') + '&longitude=' + lons.join(',');
  // the big city this spot belongs to (a suburb of Philadelphia belongs to Philadelphia) and how many people live there
  const metro = (async () => {
    const j = await getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + place.lat + '&longitude=' + place.lon + '&localityLanguage=en', 6000);
    let best = 0;
    for (const n of new Set([j.city, j.locality].filter(Boolean))) best = Math.max(best, await townPopulation(n, place.lat, place.lon, 0.6));
    return best;
  })();
  const [fr, mr, er, mp] = await Promise.allSettled([getJSON(f), getJSON(m), getJSON(e), Promise.race([metro, new Promise(r => setTimeout(() => r(0), 5000))])]);
  if (fr.status !== 'fulfilled') return {data: demoData(), marine: demoMarine(), elev:null, demo:true};
  let marine = mr.status === 'fulfilled' ? mr.value : null;
  if (Array.isArray(marine)) marine = marine.find(x => x.hourly && (x.hourly.sea_surface_temperature || []).some(v => v != null)) || null;
  const metroPop = mp.status === 'fulfilled' ? mp.value : 0;
  return {data: fr.value, marine, elev: er.status === 'fulfilled' ? er.value.elevation : null, metroPop, demo:false};
}

function demoData(){
  // Example forecast so the page shows something without a network connection.
  const days = [], time = [], H = {}; HOURLY.forEach(k => H[k] = []);
  const now = new Date();
  for (let d = 0; d < 3; d++){
    const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d);
    days.push(dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()));
  }
  const codes = [[0,2,61],[71,3,0],[1,95,80]];
  const temps = [[4,9,7],[-1,1,-3],[6,13,10]];
  days.forEach((day, d) => {
    for (let h = 0; h < 24; h++){
      time.push(day + 'T' + pad(h) + ':00');
      const slot = h < 12 ? 0 : h < 17 ? 1 : 2;
      const v10 = 2.5 + d*1.2 + 2.2*Math.sin((h-6)/24*Math.PI*2) + slot*0.8;
      const code = codes[d][slot];
      const tt = temps[d][slot] + Math.sin(h/3)*0.6;
      H.temperature_2m.push(tt); H.apparent_temperature.push(tt - v10*0.7);
      H.weather_code.push(code);
      H.precipitation.push(code >= 51 ? (code >= 80 ? 3.2 : 1.1) : 0);
      H.precipitation_probability.push(code >= 51 ? 70 + slot*8 : code >= 2 ? 15 : 0);
      H.cloud_cover.push(code === 0 ? 5 : code === 1 ? 20 : code === 2 ? 55 : 95);
      H.uv_index.push(Math.max(0, Math.sin((h-7)/10*Math.PI))*(code > 2 ? 0.8 : 2.4));
      H.wind_speed_10m.push(v10); H.wind_speed_80m.push(v10*1.55); H.wind_speed_120m.push(v10*1.72); H.wind_speed_180m.push(v10*1.9);
      H.wind_gusts_10m.push(v10*1.7);
      const base = 250 + d*40 + h*2;
      H.wind_direction_10m.push(base % 360); H.wind_direction_80m.push((base+12) % 360);
      H.wind_direction_120m.push((base+18) % 360); H.wind_direction_180m.push((base+25) % 360);
    }
  });
  return {elevation:150, hourly:Object.assign({time}, H),
    daily:{time:days, sunrise:days.map(x => x+'T07:21'), sunset:days.map(x => x+'T16:52'), uv_index_max:[1.6,0.9,2.3]}};
}
function demoMarine(){ return {demo:true, hourly:{time:[], sea_surface_temperature:[]}}; }

function hourOf(s){ const m = /T(\d\d):(\d\d)/.exec(s||''); return m ? (+m[1]) + (+m[2])/60 : null; }
function hhmm(s){ const m = /T(\d\d:\d\d)/.exec(s||''); return m ? m[1] : '—'; }
function angleLerp(a, b, t){ let d = ((b - a + 540) % 360) - 180; return (a + d*t + 360) % 360; }

// What the land around looks like, from the town's size, the relief within ~13 km, the big city it belongs to and the sea nearby.
function detectTerrain(res){
  const water = seaTempAt(res.marine, res.data.hourly.time[12]);
  const el = res.data.elevation ?? (res.elev ? res.elev[0] : 0);
  const relief = res.elev ? Math.max(...res.elev) - Math.min(...res.elev) : 0;
  const lat = Math.abs(state.place.lat);
  if ((state.place.pop || 0) >= 150000) return ['city', 'big town'];
  if (relief > 350 || (el > 1000 && relief > 150)) return ['mountains', 'relief ' + Math.round(relief) + ' m'];
  if (res.metroPop >= 300000) return ['city', 'part of a big city'];
  if (water != null) return ['sea', 'sea nearby'];
  // flat open plains in the farming belts: the Midwest, the steppe, the Pampas
  if (relief < 120 && el < 800 && lat > 25 && lat < 57) return ['field', 'plains'];
  return ['forest', relief > 150 ? 'hills' : 'lowland'];
}
// The size of the town nearest to a point, so a located phone knows it is in a city.
async function townPopulation(name, lat, lon, maxDeg = 0.35){
  if (!name) return 0;
  try {
    const j = await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=10&language=en&name=' + encodeURIComponent(name), 6000);
    const near = (j.results || []).map(r => ({r, d: Math.hypot(r.latitude - lat, (r.longitude - lon)*Math.cos(lat*Math.PI/180))})).sort((a, b) => a.d - b.d)[0];
    return near && near.d < maxDeg ? (near.r.population || 0) : 0;
  } catch(e){ return 0; }
}
function seaTempAt(marine, time){
  if (!marine || !marine.hourly || !marine.hourly.sea_surface_temperature) return null;
  const i = marine.hourly.time.indexOf(time);
  const arr = marine.hourly.sea_surface_temperature;
  const v = i >= 0 ? arr[i] : arr.find(x => x != null);
  return v == null ? null : +v;
}

function profileAt(i){
  const H = state.data.hourly;
  const g = k => (H[k] && H[k][i] != null) ? +H[k][i] : null;
  const v10 = g('wind_speed_10m') ?? 0; let v80 = g('wind_speed_80m');
  const est80 = v80 == null, est120 = g('wind_speed_120m') == null, est180 = g('wind_speed_180m') == null;
  let alpha = 0.14;
  if (v80 != null && v10 > 0.3 && v80 > 0.3) alpha = clamp(Math.log(v80/v10)/Math.log(8), 0.06, 0.4);
  const pw = h => v10 * Math.pow(h/10, alpha);
  if (v80 == null) v80 = pw(80);
  const v120 = g('wind_speed_120m') ?? pw(120), v180 = g('wind_speed_180m') ?? pw(180);
  const d10 = g('wind_direction_10m') ?? 0, d80 = g('wind_direction_80m') ?? d10;
  const d120 = g('wind_direction_120m') ?? d80, d180 = g('wind_direction_180m') ?? d120;
  const fr = h => Math.log(h/10)/Math.log(8);
  // near the ground the surface roughness matters more than the 10-80 m fit
  const terrain = state.terrainPick === 'auto' ? state.autoTerrain : state.terrainPick;
  const aLow = {forest:0.28, city:0.32, mountains:0.22, field:0.15, sea:0.11}[terrain] ?? 0.16;
  return [
    {h:2, v:v10*Math.pow(0.2, aLow), d:d10, est:true},
    {h:10, v:v10, d:d10, est:false},
    {h:20, v:pw(20), d:angleLerp(d10,d80,fr(20)), est:true},
    {h:40, v:pw(40), d:angleLerp(d10,d80,fr(40)), est:true},
    {h:80, v:v80, d:d80, est:est80},
    {h:120, v:v120, d:d120, est:est120}
  ];
}

function indexFor(day, hour){
  const d = state.data.daily.time[day]; if (!d) return -1;
  return state.data.hourly.time.indexOf(d + 'T' + pad(hour) + ':00');
}

function current(){
  const hour = state.hour;
  const i = indexFor(state.day, hour);
  if (i < 0) return null;
  const H = state.data.hourly, D = state.data.daily;
  const sunrise = hourOf(D.sunrise[state.day]) ?? 7, sunset = hourOf(D.sunset[state.day]) ?? 18;
  const terrain = state.terrainPick === 'auto' ? state.autoTerrain : state.terrainPick;
  let water = seaTempAt(state.marine, H.time[i]);
  if (state.demo && terrain === 'sea') water = 11.8;
  return {
    i, hour, sunrise, sunset, riseTxt: hhmm(D.sunrise[state.day]), setTxt: hhmm(D.sunset[state.day]),
    temp: H.temperature_2m[i], feel: H.apparent_temperature ? H.apparent_temperature[i] : null,
    prec: H.precipitation[i] || 0, pop: H.precipitation_probability ? H.precipitation_probability[i] : null, code: H.weather_code[i], cloud: H.cloud_cover[i] ?? 50, gust: H.wind_gusts_10m[i],
    uv: H.uv_index ? H.uv_index[i] : null, uvMax: D.uv_index_max ? D.uv_index_max[state.day] : null,
    w: wmo(H.weather_code[i]), profile: profileAt(i), night: hour < sunrise || hour > sunset,
    terrain, water, lat: state.place.lat, month: +D.time[state.day].slice(5,7) - 1,
    seed: Math.round(Math.abs(state.place.lat*1000 + state.place.lon*7919)) % 100000
  };
}

// ---------- formatting ----------
const fmtV = v => state.unit === 'ms' ? (v < 10 ? v.toFixed(1) : Math.round(v).toString()) : Math.round(v*3.6).toString();
const unitTxt = () => say(state.unit === 'ms' ? 'ms' : 'kmh');
const dirTxt = d => say('dirs')[Math.round(((d%360)+360)%360/45) % 8];
const tTxt = t => { const r = Math.round(t); return (r > 0 ? '+' : '') + r + '°'; };
function speedColor(v){
  if (v < 2) return '#b8e6c9';
  if (v < 5) return '#8fdc8a';
  if (v < 8) return '#e9e36a';
  if (v < 11) return '#f6b84e';
  if (v < 15) return '#f2834a';
  return '#ef5a5a';
}
function uvInfo(u){
  const t = say('uvL');
  if (u < 3) return ['#5cc46a', t[0]];
  if (u < 6) return ['#e9c53a', t[1]];
  if (u < 8) return ['#f08c2e', t[2]];
  if (u < 11) return ['#e0453a', t[3]];
  return ['#9b59d0', t[4]];
}
const ARROWS = ['↓','↙','←','↖','↑','↗','→','↘'];
const arrowFor = d => ARROWS[Math.round(((d%360)+360)%360/45) % 8];

// ---------- UI ----------
const sameSpot = (a, b) => Math.abs(a.lat - b.lat) < 0.01 && Math.abs(a.lon - b.lon) < 0.01;

function renderPlaceBar(){
  $('place-name').textContent = state.place.name;
  const isFav = state.favs.some(f => sameSpot(f, state.place));
  const fb = $('fav-btn');
  fb.textContent = isFav ? '★' : '☆';
  fb.setAttribute('aria-pressed', String(isFav));
  fb.setAttribute('aria-label', say(isFav ? 'favDel' : 'favAdd'));
  const box = $('favs'); box.innerHTML = '';
  box.hidden = !state.favs.length;
  if (state.favs.length){ const l = document.createElement('span'); l.className = 'label'; l.textContent = say('favs'); box.appendChild(l); }
  state.favs.forEach((f, k) => {
    const b = document.createElement('button');
    b.className = 'chip fav'; b.id = 'fav-' + k; b.textContent = f.name;
    b.setAttribute('aria-pressed', String(sameSpot(f, state.place)));
    b.onclick = () => setPlace(f);
    box.appendChild(b);
  });
}

function renderControls(){
  renderPlaceBar();
  const days = $('days'); days.innerHTML = '';
  state.data.daily.time.forEach((d, k) => {
    const dt = new Date(d + 'T12:00');
    const b = document.createElement('button');
    b.className = 'chip'; b.id = 'day-' + k;
    b.textContent = k === 0 ? say('today') : k === 1 ? say('tomorrow') : say('week')[dt.getDay()] + ', ' + dt.getDate();
    b.setAttribute('aria-pressed', String(k === state.day));
    b.onclick = () => { state.day = k; update(); };
    days.appendChild(b);
  });
  // one card per hour of the chosen day: hour, sky, temperature, wind at 10 m
  const hours = $('hours'); hours.innerHTML = '';
  const H = state.data.hourly, D = state.data.daily;
  const rise = hourOf(D.sunrise[state.day]) ?? 7, set = hourOf(D.sunset[state.day]) ?? 18;
  for (let h = 0; h < 24; h++){
    const i = indexFor(state.day, h); if (i < 0) continue;
    const kind = wmo(H.weather_code[i]).kind, night = h < rise || h > set;
    const ic = {clear: night ? '🌙' : '☀️', cloudy: night ? '☁️' : '⛅', overcast:'☁️', fog:'🌫️', drizzle:'🌦️', rain:'🌧️', snow:'🌨️', storm:'⛈️'}[kind] || '⛅';
    const b = document.createElement('button');
    b.id = 'h-' + h; b.setAttribute('role', 'option'); b.setAttribute('aria-selected', String(h === state.hour));
    b.innerHTML = '<span class="hh">' + pad(h) + ':00</span><span class="ic">' + ic + '</span><span class="tt">' + tTxt(H.temperature_2m[i]) + '</span><span class="ww">' + fmtV(H.wind_speed_10m[i]) + '</span>';
    b.onclick = () => { state.hour = h; update(); };
    hours.appendChild(b);
  }
  const selH = $('h-' + state.hour);
  if (selH) requestAnimationFrame(() => { hours.scrollLeft = selH.offsetLeft - hours.clientWidth/2 + selH.offsetWidth/2; });
  $('u-ms').setAttribute('aria-pressed', String(state.unit === 'ms'));
  $('u-kmh').setAttribute('aria-pressed', String(state.unit === 'kmh'));
}

function renderInfo(c){
  $('cap-temp').textContent = tTxt(c.temp);
  $('cap-cond').textContent = LANG === 'en' ? (WMO_EN[c.w.text] || c.w.text) : c.w.text;
  $('cap-feel').textContent = c.feel != null ? say('feel') + tTxt(c.feel) : '';
  $('cap-pop').textContent = c.pop != null ? '💧 ' + say('popTxt') + ' ' + Math.round(c.pop) + '%' : '';
  $('cap-sun').textContent = say('rise') + ' ' + c.riseTxt + ' · ' + say('set') + ' ' + c.setTxt;
  $('f-rise').textContent = c.riseTxt;
  $('f-set').textContent = c.setTxt;
  const hm = hrs => { const m = Math.round(hrs*60); return Math.floor(m/60) + say('h') + pad(m % 60) + say('min'); };
  $('f-daylen').textContent = say('day') + hm(c.sunset - c.sunrise);
  const now = placeNow();
  if (state.day === 0 && now.date === state.data.daily.time[0]){
    $('f-setnote').textContent = now.hour < c.sunrise ? say('notUp') : now.hour > c.sunset ? say('down') : say('inT') + hm(c.sunset - now.hour);
  } else $('f-setnote').textContent = '';
  if (c.uv != null){
    const [col, txt] = uvInfo(c.uv);
    $('f-uv').innerHTML = '<span class="uv-dot" style="background:' + col + '"></span>' + c.uv.toFixed(1);
    $('f-uvtxt').textContent = txt + (c.uvMax != null ? ', ' + say('max') + c.uvMax.toFixed(1) : '');
  } else { $('f-uv').textContent = '—'; $('f-uvtxt').textContent = say('noData'); }
  $('f-prec').textContent = c.pop != null ? Math.round(c.pop) + '%' : c.prec.toFixed(1) + say('mm');
  $('f-cloud').textContent = (c.pop != null ? c.prec.toFixed(1) + say('mm') + ', ' : '') + say('cloud') + Math.round(c.cloud) + '%';
  $('f-gust').textContent = c.gust != null ? fmtV(c.gust) + ' ' + unitTxt() : '—';
  if (c.water != null){ $('f-water').textContent = tTxt(c.water); $('f-watertxt').textContent = say(state.demo ? 'sample' : 'seaNear'); }
  else { $('f-water').textContent = '—'; $('f-watertxt').textContent = say('noSea'); }
  const tb = $('levels'); tb.innerHTML = '';
  c.profile.slice().reverse().forEach(p => {
    const k = LEVELS.findIndex(l => l.h === p.h);
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + (p.h === 2 ? say('ground') : p.h + ' ' + say('m') + ' / ' + Math.round(p.h*3.281) + ' ft') + '</td>' +
      '<td><span class="spd" style="background:' + speedColor(p.v) + '">' + (p.est ? '≈' : '') + fmtV(p.v) + '</span> <span class="est">' + unitTxt() + '</span></td>' +
      '<td><span class="arrow">' + arrowFor(p.d) + '</span> ' + dirTxt(p.d) + ' <span class="est">' + Math.round(p.d) + '°</span></td>';
    tb.appendChild(tr);
  });
}

function update(){
  if (!state.data) return;
  renderControls();
  const c = current();
  if (!c) return;
  renderInfo(c);
  scene.set(c);
}

const setLang = l => { LANG = l; try { localStorage.setItem('veter.lang', JSON.stringify(l)); } catch(e){} applyLang(); if (state.demo) showBanner(say('demo')); renderPlaceBar(); update(); };
$('l-ru').onclick = () => setLang('ru');
$('l-en').onclick = () => setLang('en');
$('u-ms').onclick = () => { state.unit = 'ms'; store.set('unit2','ms'); update(); };
$('u-kmh').onclick = () => { state.unit = 'kmh'; store.set('unit2','kmh'); update(); };
$('fav-btn').onclick = () => {
  const k = state.favs.findIndex(f => sameSpot(f, state.place));
  if (k >= 0) state.favs.splice(k, 1); else state.favs.push({name:state.place.name, lat:state.place.lat, lon:state.place.lon, pop:state.place.pop || 0});

};
function toggleSearch(open){
  const sr = $('search'); sr.hidden = !open; $('place-name').setAttribute('aria-expanded', String(open));
  if (open){ $('search-input').value = ''; $('results').innerHTML = ''; $('search-input').focus(); }
}
$('place-name').onclick = () => toggleSearch($('search').hidden);
// suggestions appear while typing; the newest request wins
let searchSeq = 0, searchTimer = 0;
async function runSearch(){
  const q = $('search-input').value.trim(), box = $('results'), seq = ++searchSeq;
  if (q.length < 2){ box.innerHTML = ''; return; }
  box.innerHTML = '<span class="note">' + say('searching') + '</span>';
  try {
    const j = await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=8&language=' + LANG + '&name=' + encodeURIComponent(q));
    if (seq !== searchSeq) return;
    box.innerHTML = '';
    if (!j.results || !j.results.length){ box.innerHTML = '<span class="note">' + say('notFound') + '</span>'; return; }
    j.results.forEach(p => {
      const b = document.createElement('button');
      const sm = document.createElement('small'); sm.textContent = [p.admin1, p.country].filter(Boolean).join(', ');
      b.append(p.name + ' ', sm);
      b.onclick = () => { toggleSearch(false); setPlace({name:p.name, lat:p.latitude, lon:p.longitude, pop:p.population || 0}); };
      box.appendChild(b);
    });
  } catch(err){
    if (seq === searchSeq) box.innerHTML = '<span class="note">' + say('noSearch') + '</span>';
  }
}
$('search-input').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 250); });
$('search-form').addEventListener('submit', e => { e.preventDefault(); clearTimeout(searchTimer); runSearch(); });

async function placeName(lat, lon){
  try {
    const j = await getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=' + LANG, 6000);

  } catch(e){ return null; }
}
function locate(auto){

  if (!auto) $('geo-btn').textContent = say('geoBusy');

    const name = await placeName(lat, lon);

}

const scene = (() => {
  const cv = $('scene'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 360, H = 460, dpr = 1, c = null, t0 = performance.now();

  let streaks = [], drops = [], splashes = [], stars = [], waves = [], flash = 0, bolt = null, built = false;
  const MONO = getComputedStyle(document.body).getPropertyValue('--mono') || 'monospace';

  function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const rnd = (a,b) => a + R()*(b-a);

  function layer(w, h){

  // left/right edge of the tower photo (fractions of its width), 41 rows from top to bottom
  const TOWER_PROFILE = [[0.492, 0.492], [0.49, 0.492], [0.481, 0.499], [0.474, 0.506], [0.454, 0.526], [0.454, 0.521], [0.447, 0.515], [0.447, 0.546], [0.461, 0.589], [0.416, 0.582], [0.456, 0.539], [0.452, 0.551], [0.449, 0.53], [0.425, 0.553], [0.422, 0.555], [0.431, 0.537], [0.443, 0.539], [0.44, 0.566], [0.438, 0.562], [0.416, 0.564], [0.407, 0.571], [0.429, 0.553], [0.425, 0.557], [0.422, 0.562], [0.418, 0.564], [0.413, 0.569], [0.411, 0.598], [0.404, 0.598], [0.402, 0.578], [0.4, 0.582], [0.396, 0.584], [0.391, 0.589], [0.389, 0.591], [0.384, 0.596], [0.378, 0.6], [0.375, 0.604], [0.369, 0.609], [0.364, 0.613], [0.362, 0.618], [0.324, 0.654], [0.324, 0.656]];
  const TOWER_TOP = 0.1; // row of the top (120 m) platform in the tower photo
  const IMG = {};
  let photosReady = false, crewReady = false;
  (() => {
    const im = new Image();
    im.onload = () => { IMG.tower = im; photosReady = true; build(); if (reduce) draw(performance.now()); };
    im.src = 'img/tower.webp';
    // the four of us, drawn in the same flat style

    [1, 2, 3, 4].forEach(i => {
      const p = new Image();

      p.src = 'img/crew' + i + '.webp';

  })();

  function geom(){
    const groundY = H*0.78, topY = H*0.12;
    const yOf = h => groundY - Math.sqrt(Math.max(h,0))/Math.sqrt(120)*(groundY - topY);
    const tx = W*(photosReady ? 0.8 : 0.76), half = Math.max(5, W*0.014);

    const th = (groundY + 3 - topY)/(1 - TOWER_TOP), tw = th*445/900, tTop = groundY + 3 - th;
    const edge = (y, side) => { const r = TOWER_PROFILE[Math.round(clamp((y - tTop)/th, 0, 1)*40)]; return tx - tw/2 + r[side]*tw; };
    return {groundY, topY, yOf, tx, half, th, tw, tTop, edge};
  }
  // ---- mood: sky colors and how the static layers are tinted ----
  function mood(){
    const k = c.w.kind, wet = ['rain','storm','snow','drizzle'].includes(k);
    const grey = wet || k === 'fog' || k === 'overcast' || c.cloud > 80;
    const golden = !c.night && (Math.abs(c.hour - c.sunset) < 1.8 || Math.abs(c.hour - c.sunrise) < 1.4);
    if (c.night) return {sky: grey ? ['#141b27','#2c3646'] : ['#050c22','#1c2b4d'], haze: grey ? '#2c3646' : '#1c2b4d', tint:'rgba(6,12,34,0.62)', cloud:['#3a4558','#1d2433'], night:true};
    if (k === 'storm') return {sky:['#2e3440','#5a6372'], haze:'#5a6372', tint:'rgba(25,30,45,0.36)', cloud:['#7b828d','#3c424d']};

    if (golden) return {sky:['#3e5d9a','#f6b07a'], haze:'#f2b98e', tint:'rgba(255,120,50,0.14)', cloud:['#fff0e0','#b07c8a']};
    return {sky:['#2a78cc','#acd7f6'], haze:'#bfe0f7', tint:null, cloud:['#ffffff','#9fb0c6']};
  }
  function tintLayer(x, w, h, m){
    if (!m.tint) return;

  }

  function seasonOf(){
    if (Math.abs(c.lat) < 23) return 'summer';
    const mm = c.lat < 0 ? (c.month + 6) % 12 : c.month;
    if (mm >= 5 && mm <= 7) return 'summer';
    if (mm === 8 || mm === 9) return 'autumn';
    if (mm === 3 || mm === 4) return 'spring';
    return 'winter';
  }
  function isSnowy(){ return c.w.kind === 'snow' || (c.temp <= -1 && seasonOf() === 'winter'); }

  // ---- flat illustrated style: layered silhouettes that fade into the haze ----
  function rgbOf(s){
    if (s[0] === '#') return hex(s);
    return s.match(/\d+/g).slice(0, 3).map(Number);
  }
  function mixc(a, b, t){ const A = rgbOf(a), B = rgbOf(b); return 'rgb(' + A.map((v,i) => Math.round(lerp(v, B[i], t))).join(',') + ')'; }

  function palette(){
    const k = c.w.kind, wet = ['rain','storm','snow','drizzle'].includes(k);
    const grey = wet || k === 'fog' || k === 'overcast' || c.cloud > 80;
    const golden = !c.night && (Math.abs(c.hour - c.sunset) < 1.8 || Math.abs(c.hour - c.sunrise) < 1.4);
    let P;
    if (c.night) P = {sky:['#0a1230','#2c3c69'], far:'#34426e', near:'#05091a', cloud:['#3d4872','#252e52'], sun:'#f3eedb'};
    else if (k === 'storm') P = {sky:['#252a38','#5d6474'], far:'#5b6271', near:'#11151e', cloud:['#6f7686','#3b4150'], sun:'#e9e6dc'};
    else if (grey) P = {sky:['#687a8e','#ccd3d8'], far:'#a9b3bd', near:'#1f2a33', cloud:['#e2e6ea','#9ea8b3'], sun:'#f6f3ea'};
    else if (golden) P = {sky:['#33447c','#f7a467'], far:'#e58f6c', near:'#26121f', cloud:['#ffd6ad','#c87574'], sun:'#fff0c9'};
    else P = {sky:['#3a80c8','#f3e0b2'], far:'#a7c9cf', near:'#0f2b26', cloud:['#ffffff','#e6cfae'], sun:'#fff6dc'};
    // each kind of place pulls the near colors toward its own hue in daylight
    const hue = {forest:'#0d2a1f', mountains:'#1b2738', sea:'#0b2c38', city:'#1b2433', field:'#4a3510'}[c.terrain];
    if (hue && !c.night && k !== 'storm') P.near = mixc(P.near, hue, golden ? 0.35 : 0.65);
    P.snow = isSnowy();
    P.col = d => mixc(P.far, P.near, clamp(d, 0, 1));
    // snow lies on the open ground; trees and rocks stay dark
    // open ground keeps its own color (green grass, golden wheat), dimmed by night and bad weather
    const gb = {forest:'#4c7a4a', mountains:'#62804f', field:'#d9a845', city:'#58784e', sea:'#58784e'}[c.terrain] || '#58784e';
    const dimG = c.night ? 0.85 : k === 'storm' ? 0.6 : grey ? 0.35 : golden ? 0.3 : 0;
    const base = mixc(gb, P.near, dimG);
    P.ground = d => P.snow ? mixc(mixc(P.far, '#ffffff', c.night ? 0.15 : 0.7), P.near, d*0.35) : mixc(mixc(base, P.far, 0.5*(1 - d)), P.near, d*0.45);
    return P;
  }

  function ridge(baseY, amp, rough, n){
    let pts = [baseY - amp*R(), baseY - amp*R()];
    let disp = amp;
    while (pts.length < n){
      const nx = [];
      for (let i = 0; i < pts.length - 1; i++){ nx.push(pts[i]); nx.push((pts[i] + pts[i+1])/2 + (R() - 0.5)*disp); }
      nx.push(pts[pts.length - 1]); pts = nx; disp *= rough;
    }
    return pts.map((y, i) => [i/(pts.length - 1)*W, Math.min(baseY, y)]);
  }
  function fillRidge(x, pts, bottom, fill){
    x.fillStyle = fill; x.beginPath(); x.moveTo(0, bottom);
    pts.forEach(([px, py]) => x.lineTo(px, py)); x.lineTo(W, bottom); x.closePath(); x.fill();
  }
  const wavy = (x, base, amp, f, ph) => base - amp*(0.55*Math.sin(x*f + ph) + 0.3*Math.sin(x*f*2.3 + ph*1.7) + 0.15*Math.sin(x*f*5.1 + ph*0.6));
  function fillLine(x, fn, bottom, fill){
    x.fillStyle = fill; x.beginPath(); x.moveTo(0, bottom);
    for (let px = 0; px <= W + 4; px += 4) x.lineTo(px, fn(px));
    x.lineTo(W, bottom); x.closePath(); x.fill();
  }
  // Firewatch-style pine: a stack of jagged tiers
  function pine(x, cx, base, h, col, snowCol){
    const w = h*0.34, tiers = 6;
    x.fillStyle = col;
    x.fillRect(cx - h*0.018, base - h*0.12, h*0.036, h*0.12);
    x.beginPath(); x.moveTo(cx, base - h);
    for (let i = 1; i <= tiers; i++){
      const f = i/tiers, y = base - h + f*h*0.9, half = w*(0.25 + 0.75*f)/2;
      x.lineTo(cx + half, y); x.lineTo(cx + half*0.55, y - h*0.03);
    }
    for (let i = tiers; i >= 1; i--){
      const f = i/tiers, y = base - h + f*h*0.9, half = w*(0.25 + 0.75*f)/2;
      x.lineTo(cx - half*0.55, y - h*0.03); x.lineTo(cx - half, y);
    }
    x.closePath(); x.fill();
    if (snowCol){
      x.fillStyle = snowCol;
      for (let i = 1; i <= tiers; i++){
        const f = i/tiers, y = base - h + f*h*0.9, half = w*(0.25 + 0.75*f)/2;
        x.beginPath(); x.moveTo(cx - half*0.8, y - h*0.012); x.lineTo(cx, y - h*0.07); x.lineTo(cx + half*0.8, y - h*0.012); x.lineTo(cx, y - h*0.035); x.closePath(); x.fill();
      }
    }
  }
  function pineRow(x, base, hgt, col, gap, snowCol){
    for (let px = -10; px < W + 14; px += gap*(0.6 + R()*0.8)) pine(x, px, base + 2, hgt*(0.6 + R()*0.6), col, snowCol);
    x.fillStyle = col; x.fillRect(0, base, W, 3);
  }
  function roundTree(x, cx, base, h, col){
    x.fillStyle = col; x.fillRect(cx - h*0.035, base - h*0.45, h*0.07, h*0.45);
    x.beginPath(); x.ellipse(cx, base - h*0.62, h*0.36, h*0.3, 0, 0, 6.29); x.fill();
    x.beginPath(); x.ellipse(cx - h*0.2, base - h*0.52, h*0.2, h*0.17, 0, 0, 6.29); x.fill();
    x.beginPath(); x.ellipse(cx + h*0.22, base - h*0.54, h*0.2, h*0.16, 0, 0, 6.29); x.fill();
  }

  // everything behind the tower
  function buildBack(g, P){
    const [k, x] = layer(W, H);
    const T = c.terrain, gy = g.groundY, snowCap = c.night ? '#c9d2e6' : '#f4f6fa';
    const snowOnTrees = P.snow ? mixc(P.far, '#ffffff', c.night ? 0.25 : 0.75) : null;
    // a pale band of haze along the horizon
    const hz = x.createLinearGradient(0, gy - H*0.3, 0, gy);
    hz.addColorStop(0, 'rgba(255,255,255,0)'); hz.addColorStop(1, mixc(P.sky[1], P.far, 0.3));

      fillRidge(x, p1, H, P.col(0.12));

      x.save(); x.beginPath(); x.moveTo(0, H); p1.forEach(([px, py]) => x.lineTo(px, py)); x.lineTo(W, H); x.closePath(); x.clip();

      pineRow(x, gy - H*0.1, H*0.06, P.col(0.5), 7, null);
      fillLine(x, px => wavy(px, gy - H*0.08, H*0.015, 0.012, 2), H, P.ground(0.55));
      pineRow(x, gy - H*0.03, H*0.09, P.col(0.7), 11, snowOnTrees);
    } else if (T === 'forest'){
      fillLine(x, px => wavy(px, gy - H*0.2, H*0.05, 0.009, 0.4), H, P.col(0.15));
      pineRow(x, gy - H*0.15, H*0.07, P.col(0.32), 8, null);
      fillLine(x, px => wavy(px, gy - H*0.1, H*0.03, 0.014, 2.2), H, P.col(0.45));
      pineRow(x, gy - H*0.08, H*0.1, P.col(0.55), 9, snowOnTrees);
      fillLine(x, px => wavy(px, gy - H*0.04, H*0.012, 0.02, 1.1), H, P.ground(0.6));
      pineRow(x, gy - H*0.035, H*0.15, P.col(0.75), 16, snowOnTrees);
    } else if (T === 'sea'){
      const hor = gy - H*0.17;
      // a far headland with a lighthouse
      fillLine(x, px => px < W*0.42 ? wavy(px, hor - H*0.03 - (W*0.42 - px)*0.06, H*0.01, 0.05, 0.3) : hor + 1, hor + 2, P.col(0.2));
      const lx = W*0.2, ly = hor - H*0.03 - W*0.22*0.06;
      x.fillStyle = P.col(0.3); x.beginPath(); x.moveTo(lx - 4, ly); x.lineTo(lx - 2.5, ly - H*0.06); x.lineTo(lx + 2.5, ly - H*0.06); x.lineTo(lx + 4, ly); x.fill();
      x.fillStyle = c.night ? '#ffe9a0' : mixc(P.col(0.3), '#ffffff', 0.4); x.fillRect(lx - 3, ly - H*0.067, 6, 4);

      const wc = c.night ? '#0d1a36' : P.snow || c.w.kind === 'storm' ? mixc(P.far, '#1c3244', 0.5) : mixc(P.far, '#1b6f8a', 0.55);
      for (let i = 0; i < 4; i++){ x.fillStyle = mixc(P.sky[1], wc, 0.35 + i*0.2); x.fillRect(0, hor + (gy - hor)*i/4*0.8, W, H); }
      // sand dunes the tower stands on
      const sand = P.snow ? P.ground(0.3) : c.night ? '#2b2b3e' : mixc('#e4c48e', P.far, c.w.kind === 'storm' ? 0.5 : 0.15);
      fillLine(x, px => wavy(px, gy - H*0.03, H*0.018, 0.012, 0.8), H, sand);
      fillLine(x, px => wavy(px, gy + H*0.01, H*0.01, 0.02, 2.4), H, mixc(sand, P.near, 0.18));
    } else if (T === 'city'){
      fillLine(x, px => wavy(px, gy - H*0.1, H*0.03, 0.01, 0.7), H, P.col(0.12));
      // two rows of buildings; windows light up after dark
      const lit = c.night || c.hour >= c.sunset - 0.5 || c.w.kind === 'storm';
      [[0.28, 0.18, 0.2], [0.17, 0.4, 0.45]].forEach(([hh, d, wf]) => {
        let px = -6;
        while (px < W){
          const bw = W*rnd(0.06, 0.12), bh = H*hh*rnd(0.45, 1), top = gy - H*0.04 - bh;

            if (R() < (lit ? 0.35 : 0.5)){ x.fillStyle = lit ? 'rgba(255,214,140,' + (0.5 + R()*0.4) + ')' : mixc(P.col(d), P.sky[1], wf); x.fillRect(wx, wy, 3, 3.5); }
          }
