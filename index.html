      roundTree(x, W*0.3, wavy(W*0.3, gy - H*0.08, H*0.025, 0.011, 1.7) + 2, H*0.09, P.col(0.5));
      fillLine(x, px => wavy(px, gy - H*0.03, H*0.015, 0.014, 0.9), H, P.ground(0.45));
      x.strokeStyle = mixc(P.ground(0.45), P.near, 0.25); x.lineWidth = 1;
      for (let i = 1; i < 6; i++){
        const yy = gy - H*0.03 + i*i*1.2;
        x.beginPath(); for (let px = 0; px <= W; px += 6) x.lineTo(px, wavy(px, yy, H*0.012, 0.014, 0.9)); x.stroke();
      }
    }
    // the ground the tower stands on
    fillLine(x, px => gy - 2 + Math.sin(px*0.02)*1.5, H, P.ground(T === 'sea' ? 0.3 : 0.65));
    return k;
  }

  // everything in front of the tower
  function buildFront(g, P){
    const [k, x] = layer(W, H);
    const T = c.terrain, gy = g.groundY;
    const fgc = T === 'sea' && !P.snow ? mixc(c.night ? '#2b2b3e' : '#d8b67e', P.near, 0.35) : P.ground(0.85);
    fillLine(x, px => wavy(px, gy + H*0.06, H*0.02, 0.009, 2.9), H, fgc);
    fillLine(x, px => wavy(px, gy + H*0.13, H*0.015, 0.012, 0.5), H, P.snow ? P.ground(0.95) : mixc(fgc, P.near, 0.5));
    if (T === 'city'){
      // a path and a street lamp
      x.fillStyle = mixc(P.ground(0.9), P.far, 0.25);
      x.beginPath(); x.moveTo(W*0.02, H); x.lineTo(W*0.18, gy + H*0.07); x.lineTo(W*0.3, gy + H*0.07); x.lineTo(W*0.62, H); x.fill();
      const lx = W*0.62, lt = gy - H*0.08;
      x.fillStyle = P.near; x.fillRect(lx - 1.5, lt, 3, gy + H*0.08 - lt); x.fillRect(lx - 1.5, lt, 12, 3);
      if (c.night || c.hour >= c.sunset - 0.5){
        const lg = x.createRadialGradient(lx + 10, lt + 4, 0, lx + 10, lt + 4, 40);
        lg.addColorStop(0, 'rgba(255,214,140,0.55)'); lg.addColorStop(1, 'rgba(255,214,140,0)');
        x.fillStyle = lg; x.fillRect(lx - 30, lt - 36, 80, 80);
      }
    }
    return k;
  }

  // flat clouds: rounded tops on a flat base, a darker belly
  function makeFlatCloud(w, h, top, under){
    const [k, x] = layer(w, h);
    x.fillStyle = top;
    const n = 5 + Math.floor(R()*3);
    for (let i = 0; i < n; i++){
      const f = (i + 0.5)/n, r = h*(0.22 + 0.3*Math.sin(Math.PI*f))*(0.8 + R()*0.35);
      x.beginPath(); x.arc(w*0.08 + f*w*0.84, h*0.82 - r*0.75, r, 0, 6.29); x.fill();
    }
    x.beginPath(); x.roundRect ? x.roundRect(w*0.03, h*0.62, w*0.94, h*0.2, h*0.1) : x.rect(w*0.03, h*0.62, w*0.94, h*0.2); x.fill();
    x.globalCompositeOperation = 'source-atop'; x.fillStyle = under; x.fillRect(0, h*0.66, w, h);
    return k;
  }

  // the crew, drawn as flat figures with their own colors: blue helmet, coffee, cap, orange helmet
  function figure(x, cx, base, h, P, o){
    const body = mixc(P.near, '#000000', 0.25), rim = mixc(P.sky[1], body, c.night ? 0.75 : 0.45);
    const acc = col => c.night ? mixc(col, body, 0.55) : P.snow || c.w.kind === 'storm' ? mixc(col, body, 0.25) : col;
    const hr = h*0.065, hy = base - h + hr*1.1, sh = base - h*0.8, hip = base - h*0.47, sw = h*o.wide, hw = h*0.088;
    x.lineCap = 'round'; x.lineJoin = 'round';
    const paint = (col, dx) => {
      x.fillStyle = col; x.strokeStyle = col;
      const X = cx + dx, ww = h*0.088;
      // legs: two tapered trousers with a gap between them
      [-1, 1].forEach(sd => {
        x.beginPath(); x.moveTo(X + sd*h*0.006, hip); x.lineTo(X + sd*ww, hip); x.lineTo(X + sd*h*0.07, base - h*0.03); x.lineTo(X + sd*h*0.02, base - h*0.03); x.closePath(); x.fill();
        // boot
        x.beginPath(); x.ellipse(X + sd*h*0.047, base - h*0.018, h*0.04, h*0.02, 0, 0, 6.29); x.fill();
      });
      // torso: broad shoulders narrowing to the waist
      x.beginPath(); x.moveTo(X - sw, sh + h*0.04); x.quadraticCurveTo(X - sw, sh, X - sw*0.55, sh - h*0.012); x.lineTo(X + sw*0.55, sh - h*0.012);
      x.quadraticCurveTo(X + sw, sh, X + sw, sh + h*0.04); x.lineTo(X + ww*1.02, hip + h*0.015); x.lineTo(X - ww*1.02, hip + h*0.015); x.closePath(); x.fill();
      // neck and head
      x.fillRect(X - hr*0.42, hy, hr*0.84, sh - hy); x.beginPath(); x.ellipse(X, hy, hr*0.9, hr, 0, 0, 6.29); x.fill();
      // arms: upper arm and forearm
      x.lineWidth = h*0.048;
      const arm = (sd, pose) => {
        const sx = X + sd*sw*0.86, sy = sh + h*0.035;
        let ex, ey, hx, hy2;
        if (pose === 'cup'){ ex = sx + sd*h*0.03; ey = sy + h*0.15; hx = X + sd*sw*0.28; hy2 = sy + h*0.11; }
        else if (pose === 'hip'){ ex = sx + sd*h*0.085; ey = sy + h*0.12; hx = X + sd*ww*1.05; hy2 = hip - h*0.03; }
        else if (pose === 'pocket'){ ex = sx + sd*h*0.03; ey = sy + h*0.16; hx = X + sd*ww*0.95; hy2 = hip + h*0.04; }
        else { ex = sx + sd*h*0.022; ey = sy + h*0.16; hx = sx + sd*h*0.012; hy2 = sy + h*0.31; }
        x.beginPath(); x.moveTo(sx, sy); x.lineTo(ex, ey); x.lineTo(hx, hy2); x.stroke();
        x.beginPath(); x.arc(hx, hy2, h*0.027, 0, 6.29); x.fill();
        return [hx, hy2];
      };
      hands = [arm(-1, o.arms[0]), arm(1, o.arms[1])];
    };
    let hands = [];
    // a thin rim of sky light on one side, then the figure itself
    paint(rim, -1.2); paint(body, 0);
    // details
    if (o.helmet){
      x.fillStyle = acc(o.helmet);
      x.beginPath(); x.arc(cx, hy - hr*0.15, hr*1.12, Math.PI, 0); x.fill(); x.fillRect(cx - hr*1.35, hy - hr*0.2, hr*2.7, hr*0.3);
    }
    if (o.cap){ x.fillStyle = acc(o.cap); x.beginPath(); x.arc(cx, hy - hr*0.2, hr*1.05, Math.PI, 0); x.fill(); x.fillRect(cx - hr*0.6, hy - hr*0.25, hr*1.9, hr*0.28); }
    if (o.vest){ x.fillStyle = acc(o.vest); x.fillRect(cx - sw*0.62, sh + h*0.005, sw*0.24, h*0.31); x.fillRect(cx + sw*0.38, sh + h*0.005, sw*0.24, h*0.31); }
    if (o.harness){ x.strokeStyle = acc(o.harness); x.lineWidth = h*0.014; x.beginPath(); x.moveTo(cx - sw*0.5, sh); x.lineTo(cx - hw*0.4, hip); x.moveTo(cx + sw*0.5, sh); x.lineTo(cx + hw*0.4, hip); x.moveTo(cx - hw*1.05, hip - h*0.01); x.lineTo(cx + hw*1.05, hip - h*0.01); x.stroke(); }
    if (o.gloves){
      x.fillStyle = acc(o.gloves);
      hands.forEach(([gx, gy2]) => { x.beginPath(); x.arc(gx, gy2, h*0.031, 0, 6.29); x.fill(); });
    }
    if (o.coffee){
      const cx2 = hands[1][0], cy = hands[1][1] + h*0.01;
      x.fillStyle = acc('#f2efe8'); x.beginPath(); x.moveTo(cx2 - h*0.022, cy - h*0.05); x.lineTo(cx2 + h*0.022, cy - h*0.05); x.lineTo(cx2 + h*0.017, cy + h*0.01); x.lineTo(cx2 - h*0.017, cy + h*0.01); x.fill();
      x.fillStyle = acc('#8a5a34'); x.fillRect(cx2 - h*0.02, cy - h*0.03, h*0.04, h*0.018);
      // a curl of steam on a cold day
      if (c.temp < 12){ x.strokeStyle = 'rgba(255,255,255,0.45)'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(cx2, cy - h*0.06); x.bezierCurveTo(cx2 - 4, cy - h*0.09, cx2 + 4, cy - h*0.11, cx2, cy - h*0.15); x.stroke(); }
    }
  }
  function buildCrew(g, P){
    const [k, x] = layer(W, H), ph = H*0.25;
    crewSprites = [];
    if (crewReady){
      // the same light as the rest of the scene: darker at night and in storms, warmer at sunset
      const k2 = c.w.kind, grey = ['rain','snow','drizzle','fog','overcast'].includes(k2) || c.cloud > 80;
      const golden = !c.night && (Math.abs(c.hour - c.sunset) < 1.8 || Math.abs(c.hour - c.sunrise) < 1.4);
      const tint = c.night ? [P.near, 0.55] : k2 === 'storm' ? [P.near, 0.35] : grey ? [P.far, 0.15] : golden ? ['#ff9a5a', 0.14] : null;
      // back row first: orange helmet behind the blue helmet on his side, the cap to the right behind the coffee
      [['crew4', 0.1, H*0.285, 30], ['crew3', 0.47, H*0.28, 28], ['crew1', 0.22, H*0.31, 8], ['crew2', 0.35, H*0.305, 10]].forEach(([key, fx, hh, dy], i) => {
        const im = IMG[key], ww = im.width*hh/im.height, [kk, xx] = layer(ww, hh);
        xx.drawImage(im, 0, 0, ww, hh);
        if (tint){ xx.globalCompositeOperation = 'source-atop'; xx.globalAlpha = tint[1]; xx.fillStyle = tint[0]; xx.fillRect(0, 0, ww, hh); }
        crewSprites.push({img: kk, w: ww, h: hh, x: W*fx, base: H - dy, ph: i*2.3 + 0.7, sp: 0.85 + i*0.11});
      });
      return k;
    }
    // back row first: orange helmet behind the blue helmet on his side, the cap to the right behind the coffee
    figure(x, W*0.09, H - 30, ph*0.93, P, {wide:0.125, helmet:'#f07a1a', gloves:'#f2cf1d', harness:'#3d3d3d', arms:['hip','hip']});
    figure(x, W*0.46, H - 28, ph*0.94, P, {wide:0.12, cap:'#3a4a5c', arms:['pocket','pocket']});
    figure(x, W*0.2, H - 10, ph, P, {wide:0.12, helmet:'#2c7fe0', harness:'#2e5d8a', arms:['down','down']});
    figure(x, W*0.335, H - 12, ph*0.98, P, {wide:0.13, coffee:true, vest:'#9a6a3a', arms:['down','cup']});
    return k;
  }
  // ---- the met mast: guyed lattice painted in aviation red and white ----
  function buildMast(g, m){
    const [k, x] = layer(W, H);
    if (photosReady){
      const bw = g.tw*0.42, bs = x.createRadialGradient(g.tx, 0, 0, g.tx, 0, bw);
      bs.addColorStop(0, 'rgba(0,0,0,0.4)'); bs.addColorStop(1, 'rgba(0,0,0,0)');
      x.save(); x.translate(0, g.groundY + 2); x.scale(1, 0.18); x.fillStyle = bs; x.beginPath(); x.arc(g.tx, 0, bw, 0, 6.29); x.fill(); x.restore();
      x.drawImage(IMG.tower, g.tx - g.tw/2, g.tTop, g.tw, g.th);
      // thin steel booms to the right carry the instruments at each measured height
      c.profile.forEach(p => {
        const y = g.yOf(p.h), r = g.edge(y, 1);
        x.strokeStyle = '#5d646d'; x.lineWidth = 1.6;
        x.beginPath(); x.moveTo(r - 2, y); x.lineTo(r + 24, y); x.stroke();
        x.lineWidth = 1.1; x.beginPath(); x.moveTo(r + 22, y); x.lineTo(r + 22, y - 8); x.stroke();
        x.beginPath(); x.moveTo(r + 10, y); x.lineTo(r + 10, y - 5); x.stroke();
        x.strokeStyle = 'rgba(40,45,50,0.6)'; x.lineWidth = 0.7; x.beginPath(); x.moveTo(r + 22, y); x.lineTo(r, y - 9); x.stroke();
      });
      tintLayer(x, W, H, m);
      // a touch of the same haze as the hills behind it
      x.save(); x.globalCompositeOperation = 'source-atop'; x.globalAlpha = 0.12; x.fillStyle = P.far; x.fillRect(0, 0, W, H); x.restore();
      return k;
    }
    const L = g.tx - g.half, Rr = g.tx + g.half;
    // guy wires
    x.strokeStyle = 'rgba(40,45,55,0.5)'; x.lineWidth = 0.8;
    [60, 120, 175].forEach((h, i) => {
      const y = g.yOf(h);
      [[g.tx - W*(0.2 + i*0.06), g.groundY + 4], [g.tx + W*(0.13 + i*0.04), g.groundY + 4]].forEach(([ax, ay]) => { x.beginPath(); x.moveTo(g.tx, y); x.lineTo(ax, ay); x.stroke(); });
    });
    // painted bands
    const bands = 9, span = g.groundY - g.topY;
    for (let b = 0; b < bands; b++){
      const y1 = g.groundY - span*b/bands, y2 = g.groundY - span*(b+1)/bands;
      const col = b % 2 ? '#f1f1ee' : '#d8432d';
      x.strokeStyle = col; x.lineWidth = 2.4;
      x.beginPath(); x.moveTo(L, y1); x.lineTo(L, y2); x.moveTo(Rr, y1); x.lineTo(Rr, y2); x.stroke();
      x.lineWidth = 1;
      const step = g.half*2.2;
      for (let y = y1; y > y2 + 0.5; y -= step){
        const yn = Math.max(y2, y - step);
        x.beginPath(); x.moveTo(L, y); x.lineTo(Rr, (y + yn)/2); x.lineTo(L, yn); x.stroke();
        x.beginPath(); x.moveTo(L, yn); x.lineTo(Rr, yn); x.stroke();
      }
    }
    // shading on the right leg
    x.strokeStyle = 'rgba(0,0,0,0.25)'; x.lineWidth = 1; x.beginPath(); x.moveTo(Rr + 1, g.groundY); x.lineTo(Rr + 1, g.topY); x.stroke();
    // ladder line
    x.strokeStyle = 'rgba(60,60,60,0.5)'; x.beginPath(); x.moveTo(g.tx, g.groundY); x.lineTo(g.tx, g.topY); x.stroke();
    // top: lightning rod
    x.strokeStyle = '#3d434c'; x.lineWidth = 1.6; x.beginPath(); x.moveTo(g.tx, g.topY); x.lineTo(g.tx, g.topY - 24); x.stroke();
    // concrete base and a small equipment cabinet
    x.fillStyle = '#9a9c9f'; x.fillRect(L - 6, g.groundY - 3, (Rr - L) + 12, 6);
    x.fillStyle = '#c9ccd0'; x.fillRect(Rr + 6, g.groundY - 12, 12, 12); x.fillStyle = '#8b9096'; x.fillRect(Rr + 6, g.groundY - 13, 13, 2);
    // booms at every measured height
    c.profile.forEach(p => {
      const y = g.yOf(p.h);
      x.strokeStyle = '#4a515b'; x.lineWidth = 2;
      x.beginPath(); x.moveTo(L - 3, y); x.lineTo(Rr + 22, y); x.stroke();
      x.lineWidth = 1.4; x.beginPath(); x.moveTo(Rr + 22, y); x.lineTo(Rr + 22, y - 9); x.stroke();
      x.beginPath(); x.moveTo(Rr + 10, y); x.lineTo(Rr + 10, y - 6); x.stroke();
    });
    tintLayer(x, W, H, m);
    return k;
  }

  let crewSprites = [], back = null, front = null, crewLayer = null, P = null, birds = [], tufts = [], bigPines = [];
  function build(){
    if (!c) return;
    R = mulberry(c.seed + 17);
    const g = geom(), m = mood();
    P = palette();
    back = buildBack(g, P); front = buildFront(g, P); crewLayer = buildCrew(g, P); mast = buildMast(g, m);
    // clouds
    const n = Math.round(clamp(c.cloud/100*7, 0, 7));
    cloudSprites = [];
    for (let j = 0; j < n; j++){
      const w = W*rnd(0.3, 0.6), h = w*0.36;
      cloudSprites.push({img: makeFlatCloud(w, h, P.cloud[0], P.cloud[1]), w, h, x: rnd(-0.3, 1.0)*W, y: rnd(0.03, 0.32)*H, s: rnd(0.6, 1.1)});
    }
    // tall pines in the foreground that sway with the ground wind
    bigPines = [];
    if (c.terrain === 'forest' || c.terrain === 'mountains'){
      [[-0.04, 0.62], [1.02, 0.5]].forEach(([fx, fh], j) => {
        const hh = H*fh, ww = hh*0.4, [kk, xx] = layer(ww, hh);
        pine(xx, ww/2, hh, hh, mixc(P.near, '#000000', 0.2), P.snow ? mixc(P.far, '#ffffff', c.night ? 0.2 : 0.65) : null);
        bigPines.push({img: kk, w: ww, h: hh, x: fx*W, ph: j*1.7});
      });
    }
    tufts = []; for (let j = 0; j < 26; j++) tufts.push({x: rnd(0, W), y: rnd(g.groundY + H*0.07, H), h: rnd(6, 14), ph: rnd(0, 6.28)});
    birds = c.night || ['storm','rain'].includes(c.w.kind) ? [] : [0, 1, 2].map(j => ({x: rnd(0, W*0.6), y: H*rnd(0.25, 0.4), ph: rnd(0, 6.28), s: rnd(0.8, 1.2)}));
    streaks = [];
    c.profile.forEach((p, k) => {
      const nn = Math.round(clamp(3 + p.v*1.1, 3, 16));
      for (let j = 0; j < nn; j++) streaks.push({k, x: rnd(0, W), dy: rnd(-9, 9), len: rnd(0.7, 1.3), ph: rnd(0, 6.28)});
    });
    const kind = c.w.kind, pr = ['rain','storm','drizzle','snow'].includes(kind);
    const nd = !pr ? 0 : kind === 'snow' ? clamp(110 + c.prec*60, 110, 280) : kind === 'drizzle' ? 140 : clamp(160 + c.prec*70, 160, 420);
    drops = []; for (let j = 0; j < nd; j++) drops.push({x: rnd(-W*0.2, W*1.2), y: rnd(-H, H), s: rnd(0.5, 1.2), ph: rnd(0, 6.28)});
    splashes = [];
    stars = []; for (let j = 0; j < 90; j++) stars.push({x: rnd(0, W), y: rnd(0, H*0.6), r: rnd(0.3, 1.4), ph: rnd(0, 6.28)});
    waves = []; for (let j = 0; j < 40; j++) waves.push({x: rnd(0, W), f: R(), ph: rnd(0, 6.28)});
    built = true;
  }
  function resize(){
    const w = cv.parentElement.clientWidth;
    W = w; H = Math.round(clamp(w*1.42, 460, 760));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.height = H + 'px';
    build();
  }

  function set(cur){ c = cur; build(); if (reduce) draw(performance.now()); }

  // ---------------- per-frame drawing ----------------
  function draw(now){
    if (!c || !built) return;
    const t = (now - t0)/1000;
    const g = geom();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const gr = ctx.createLinearGradient(0, 0, 0, g.groundY); gr.addColorStop(0, P.sky[0]); gr.addColorStop(1, P.sky[1]);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

    if (c.night && c.cloud < 75){
      stars.forEach(s => { ctx.globalAlpha = clamp(0.45 + 0.55*Math.sin(t*1.3 + s.ph), 0.1, 1); ctx.fillStyle = '#ffffff'; ctx.fillRect(s.x, s.y, s.r*1.4, s.r*1.4); });
      ctx.globalAlpha = 1;
    }
    const body = drawSun(g, t);

    // clouds drift with the 120 m wind
    const p120 = c.profile[5], uc = uOf(p120.d)*p120.v;
    if (c.cloud > 85){ ctx.fillStyle = P.cloud[1]; ctx.globalAlpha = 0.5; ctx.fillRect(0, 0, W, H*0.08); ctx.globalAlpha = 1; }
    cloudSprites.forEach(cl => {
      if (!reduce) cl.x += uc*0.01*cl.s;
      if (cl.x > W + 20) cl.x = -cl.w - 20; if (cl.x < -cl.w - 20) cl.x = W + 20;
      ctx.drawImage(cl.img, cl.x, cl.y, cl.w, cl.h);
    });
    drawBirds(t);

    ctx.drawImage(back, 0, 0, W, H);
    if (c.terrain === 'sea') drawWater(g, t, body);
    drawStreaks(g, t);
    ctx.drawImage(mast, 0, 0, W, H);
    drawMastParts(g, t);

    const pg = c.profile[0], ug = uOf(pg.d);
    ctx.drawImage(front, 0, 0, W, H);
    bigPines.forEach(tr => {
      const amp = clamp(0.008 + pg.v*0.004, 0.008, 0.08);
      const sway = (reduce ? 0 : Math.sin(t*(1.1 + pg.v*0.1) + tr.ph)*amp) + ug*clamp(pg.v*0.008, 0, 0.12);
      ctx.save(); ctx.translate(tr.x, H + 2); ctx.transform(1, 0, -sway, 1, 0, 0);
      ctx.drawImage(tr.img, -tr.w/2, -tr.h, tr.w, tr.h); ctx.restore();
    });
    drawTufts(t, pg, ug);
    if (crewSprites.length) drawCrew(t, pg, ug); else ctx.drawImage(crewLayer, 0, 0, W, H);
    drawPrecip(g, t);

    if (c.w.kind === 'fog'){
      for (let i = 0; i < 3; i++){
        const y = g.groundY - H*(0.1 + i*0.12), fgx = ctx.createLinearGradient(0, y - H*0.12, 0, y + H*0.12);
        fgx.addColorStop(0, 'rgba(225,230,236,0)'); fgx.addColorStop(0.5, 'rgba(225,230,236,0.45)'); fgx.addColorStop(1, 'rgba(225,230,236,0)');
        ctx.fillStyle = fgx; ctx.fillRect(0, y - H*0.12, W, H*0.24);
      }
      ctx.fillStyle = 'rgba(220,226,232,0.25)'; ctx.fillRect(0, 0, W, H);
    }
    if (c.w.kind === 'storm' && !reduce) drawLightning(g);
    drawPills(g);
  }

  // flat sun or moon with soft rings
  function drawSun(g, t){
    let p;
    if (!c.night) p = clamp((c.hour - c.sunrise)/(c.sunset - c.sunrise), 0.04, 0.96);
    else { const len = 24 - (c.sunset - c.sunrise); const h = c.hour > c.sunset ? c.hour - c.sunset : c.hour + 24 - c.sunset; p = clamp(h/len, 0.08, 0.92); }
    const x = W*(0.1 + 0.5*p), y = g.groundY - Math.sin(Math.PI*p)*(g.groundY - H*0.2) - 14;
    const wet = ['rain','storm','snow','drizzle','fog'].includes(c.w.kind);
    const dim = wet && c.cloud > 80 ? 0.12 : c.cloud > 85 ? 0.25 : 1;
    const Rs = Math.max(14, W*0.045)*(c.night ? 0.75 : 1);
    ctx.save(); ctx.globalAlpha = dim;
    [3.2, 2.2, 1.55].forEach((f, i) => {
      ctx.fillStyle = mixc(P.sky[1], P.sun, 0.25 + i*0.2); ctx.globalAlpha = dim*(0.18 + i*0.12)*(1 + (reduce ? 0 : 0.08*Math.sin(t*0.8 + i)));
      ctx.beginPath(); ctx.arc(x, y, Rs*f, 0, 6.29); ctx.fill();
    });
    ctx.globalAlpha = dim; ctx.fillStyle = P.sun; ctx.beginPath(); ctx.arc(x, y, Rs, 0, 6.29); ctx.fill();
    if (c.night){ ctx.fillStyle = P.sky[0]; ctx.globalAlpha = dim*0.9; ctx.beginPath(); ctx.arc(x + Rs*0.45, y - Rs*0.25, Rs*0.85, 0, 6.29); ctx.fill(); }
    ctx.restore();
    return {x, y, day: !c.night, dim};
  }

  // the sea: drifting glints and a sun path on the flat water bands
  function drawWater(g, t, body){
    const hor = g.groundY - H*0.17, depth = H*0.12;
    const v = c.profile[1].v, u = uOf(c.profile[1].d);
    if (body.dim > 0.5){
      ctx.fillStyle = mixc(P.sun, P.sky[1], 0.3);
      for (let i = 0; i < 10; i++){
        const f = i/10, w = 8 + f*30;
        ctx.globalAlpha = 0.6*(1 - f); ctx.fillRect(body.x - w/2 + Math.sin(t*1.6 + i)*3, hor + 2 + f*depth, w, 1.6);
      }
      ctx.globalAlpha = 1;
    }
    waves.forEach(w => {
      const y = hor + 3 + w.f*depth;
      if (!reduce) w.x += u*(0.12 + v*0.04)*(0.4 + w.f);
      if (w.x > W + 20) w.x = -20; if (w.x < -20) w.x = W + 20;
      ctx.globalAlpha = clamp((v - 1)/10, 0.2, 0.8)*(0.5 + 0.5*Math.sin(t*1.4 + w.ph));
      ctx.fillStyle = '#ffffff'; ctx.fillRect(w.x, y, 4 + w.f*14, 1 + w.f);
    });
    ctx.globalAlpha = 1;
  }
  function drawStreaks(g, t){
    ctx.lineCap = 'round';
    c.profile.forEach((p, k) => {
      const y = g.yOf(p.h), u = uOf(p.d), dir = Math.sign(u || 1);
      const speed = (4 + p.v*14)*(Math.abs(u) < 0.15 ? 0.3 : 1);
      ctx.strokeStyle = 'rgba(255,255,255,' + clamp(0.16 + p.v*0.04, 0.18, 0.7) + ')';
      ctx.lineWidth = 1.3;
      streaks.forEach(s => {
        if (s.k !== k) return;
        if (!reduce) s.x += dir*speed/60;
        if (s.x > W + 40) s.x = -40; if (s.x < -40) s.x = W + 40;
        const L = (10 + p.v*4.5)*s.len*dir, yy = y + s.dy + Math.sin(t*2 + s.ph + s.x*0.02)*2;
        ctx.beginPath(); ctx.moveTo(s.x, yy); ctx.quadraticCurveTo(s.x - L*0.5, yy - 2, s.x - L, yy); ctx.stroke();
      });
    });
  }

  function drawMastParts(g, t){
    const col = c.night ? '#aab3bf' : '#2f353d';
    c.profile.forEach(p => {
      const y = g.yOf(p.h), u = uOf(p.d), Rr = photosReady ? g.edge(y, 1) : g.tx + g.half;
      // cup anemometer
      const ax = Rr + 22, ay = y - 9, rot = reduce ? 0.5 : t*(0.6 + p.v*0.9);
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.1;
      for (let j = 0; j < 3; j++){
        const a = rot + j*2.094, ex = ax + Math.cos(a)*6.5, ey = ay + Math.sin(a)*2;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.beginPath(); ctx.arc(ex, ey, 1.9, 0, 6.29); ctx.fill();
      }
      // wind vane: tail points downwind, shorter when the wind blows toward or away from us
      const vx = Rr + 10, vy = y - 6, len = 8*Math.max(0.25, Math.abs(u)), dir = Math.sign(u || 1);
      ctx.beginPath(); ctx.moveTo(vx - dir*len*0.6, vy); ctx.lineTo(vx + dir*len, vy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(vx + dir*len, vy - 3); ctx.lineTo(vx + dir*(len + 3), vy); ctx.lineTo(vx + dir*len, vy + 3); ctx.closePath(); ctx.fill();
    });
    const on = Math.sin(t*2.6) > 0.3 || reduce;
    const by = photosReady ? g.tTop + g.th*0.006 : g.topY - 25;
    if (on){
      const bg = ctx.createRadialGradient(g.tx, by, 0, g.tx, by, 14); bg.addColorStop(0, 'rgba(255,60,50,0.9)'); bg.addColorStop(1, 'rgba(255,60,50,0)');
      ctx.fillStyle = bg; ctx.fillRect(g.tx - 14, by - 14, 28, 28);
    }
    ctx.fillStyle = on ? '#ff5a4a' : '#7a2a24'; ctx.beginPath(); ctx.arc(g.tx, by, 3, 0, 6.29); ctx.fill();
  }

  // the crew stands and breathes: drawn in thin slices so the body can sway and the head can turn a little
  function drawCrew(t, pg, ug){
    const lean = ug*clamp(pg.v*0.04, 0, 0.5);
    crewSprites.forEach(p => {
      const T = reduce ? 0 : t*p.sp;
      const sway = Math.sin(T*0.9 + p.ph)*0.6 + Math.sin(T*0.37 + p.ph*1.7)*0.4 + lean;
      const look = Math.sin(T*0.23 + p.ph*2.1)*0.7 + Math.sin(T*0.61 + p.ph)*0.3;
      const breath = 1 + Math.sin(T*1.6 + p.ph)*0.007, shift = Math.sin(T*0.31 + p.ph)*p.h*0.006;
      const sw = p.w*0.45, sh = ctx.createRadialGradient(p.x + shift, 0, 0, p.x + shift, 0, sw);
      sh.addColorStop(0, 'rgba(0,0,0,0.3)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.save(); ctx.translate(0, p.base - 2); ctx.scale(1, 0.16); ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(p.x + shift, 0, sw, 0, 6.29); ctx.fill(); ctx.restore();
      const n = Math.ceil(p.h/2), ih = p.img.height, hh = p.h*breath;
      for (let i = 0; i < n; i++){
        const f = 1 - (i + 0.5)/n; // 1 at the top of the head, 0 at the feet
        const head = Math.max(0, f - 0.84)/0.16;
        const dx = shift*f + sway*f*f*p.h*0.018 + look*head*p.h*0.012;
        ctx.drawImage(p.img, 0, i*ih/n, p.img.width, ih/n + 1, p.x - p.w/2 + dx, p.base - hh + i*hh/n, p.w, hh/n + 0.6);
      }
    });
  }

  // grass tufts in the foreground bend with the ground wind
  function drawTufts(t, pg, ug){
    if (c.terrain === 'city') return;
    const col = P.snow ? mixc(P.near, P.far, 0.35) : c.terrain === 'field' ? mixc('#c9a24a', P.near, c.night ? 0.8 : 0.35) : mixc(P.near, '#000000', 0.15);
    ctx.strokeStyle = col; ctx.lineCap = 'round';
    tufts.forEach((s, i) => {
      const bend = (reduce ? 0 : Math.sin(t*2.4 + s.ph)*(1 + pg.v*0.35)) + ug*pg.v*1.1;
      ctx.lineWidth = 1.4;
      for (let b = -1; b <= 1; b++){
        ctx.beginPath(); ctx.moveTo(s.x + b*2, s.y); ctx.quadraticCurveTo(s.x + b*2 + bend*0.3, s.y - s.h*0.6, s.x + b*3.5 + bend, s.y - s.h*(1 - Math.abs(b)*0.2)); ctx.stroke();
      }
    });
  }
  // a few birds riding the 40 m wind
  function drawBirds(t){
    if (!birds.length) return;
    const p = c.profile[3], u = uOf(p.d);
    ctx.strokeStyle = mixc(P.near, P.sky[1], 0.35); ctx.lineWidth = 1.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    birds.forEach(b => {
      if (!reduce) b.x += (0.25 + u*p.v*0.04)*b.s;
      if (b.x > W + 20) b.x = -20; if (b.x < -20) b.x = W + 20;
      const f = reduce ? 0.5 : Math.sin(t*6*b.s + b.ph), s = 5*b.s, y = b.y + Math.sin(t*0.7 + b.ph)*4;
      ctx.beginPath(); ctx.moveTo(b.x - s, y - f*s*0.6); ctx.quadraticCurveTo(b.x - s*0.4, y - s*0.3, b.x, y); ctx.quadraticCurveTo(b.x + s*0.4, y - s*0.3, b.x + s, y - f*s*0.6); ctx.stroke();
    });
  }
  function drawPrecip(g, t){
    if (!drops.length) return;
    const pg = c.profile[1], u = uOf(pg.d)*pg.v, snow = c.w.kind === 'snow';
    ctx.lineCap = 'round';
    drops.forEach(d => {
      if (snow){
        if (!reduce){ d.y += (35 + 25*d.s)/60; d.x += (u*16 + Math.sin(t*1.4 + d.ph)*14)/60; }
        const r = 1.2 + d.s*2;
        const sg = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, r); sg.addColorStop(0, 'rgba(255,255,255,0.95)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, 6.29); ctx.fill();
      } else {
        const vy = (c.w.kind === 'drizzle' ? 280 : 560)*d.s, vx = u*48;
        if (!reduce){ d.y += vy/60; d.x += vx/60; }
        const len = c.w.kind === 'drizzle' ? 6 : 16*d.s;
        const rg = ctx.createLinearGradient(d.x, d.y - len, d.x, d.y);
        rg.addColorStop(0, 'rgba(210,228,255,0)'); rg.addColorStop(1, 'rgba(210,228,255,0.75)');
        ctx.strokeStyle = rg; ctx.lineWidth = c.w.kind === 'drizzle' ? 0.9 : 1.3;
        ctx.beginPath(); ctx.moveTo(d.x - vx/vy*len, d.y - len); ctx.lineTo(d.x, d.y); ctx.stroke();
      }
      const floor = g.groundY + (H - g.groundY)*d.s*0.8;
      if (d.y > floor){
        if (!snow && splashes.length < 60) splashes.push({x: d.x, y: floor, a: 1});
        d.y = rnd(-40, 0); d.x = rnd(-W*0.2, W*1.2);
      }
      if (d.x > W*1.25) d.x = -W*0.2; if (d.x < -W*0.25) d.x = W*1.2;
    });
    ctx.strokeStyle = 'rgba(220,235,255,0.6)'; ctx.lineWidth = 1;
    splashes = splashes.filter(s => {
      s.a -= 0.08; if (s.a <= 0) return false;
      ctx.globalAlpha = s.a; ctx.beginPath(); ctx.ellipse(s.x, s.y, (1 - s.a)*6 + 1, (1 - s.a)*1.6 + 0.4, 0, 0, 6.29); ctx.stroke();
      return true;
    });
    ctx.globalAlpha = 1;
  }

  function drawLightning(g){
    if (!bolt && Math.random() < 0.005){
      const pts = []; let x = rnd(W*0.1, W*0.6), y = H*0.12;
      while (y < g.groundY){ pts.push([x, y]); x += rnd(-14, 14); y += rnd(10, 22); }
      bolt = {pts, life: 1}; flash = 1;
    }
    if (flash > 0){ ctx.fillStyle = 'rgba(235,240,255,' + flash*0.5 + ')'; ctx.fillRect(0, 0, W, H); flash -= 0.07; }
    if (bolt){
      ctx.save(); ctx.shadowColor = 'rgba(200,215,255,0.9)'; ctx.shadowBlur = 14;
      ctx.strokeStyle = 'rgba(255,255,255,' + bolt.life + ')'; ctx.lineWidth = 2.2;
      ctx.beginPath(); bolt.pts.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke(); ctx.restore();
      bolt.life -= 0.06; if (bolt.life <= 0) bolt = null;
    }
  }

  function drawPills(g){
    ctx.font = '600 10px ' + MONO; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    if (false) c.profile.forEach(p => {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 3; ctx.fillStyle = '#ffffff';
      ctx.fillText(p.h + ' м', Math.min(g.tx + g.half + 32, W - ctx.measureText(p.h + ' м').width - 4), g.yOf(p.h) + 1); ctx.restore();
    });
    // keep the two-line pills from overlapping where the low levels crowd together
    const ys = []; c.profile.forEach((p, k) => { ys[k] = k ? Math.min(g.yOf(p.h), ys[k-1] - 33) : g.yOf(p.h); });
    c.profile.forEach((p, k) => {
      const y = ys[k], right = photosReady ? g.edge(g.yOf(p.h), 0) - 6 : g.tx - g.half - 7;
      const txt = (p.est ? '≈' : '') + fmtV(p.v), un = ' ' + unitTxt(), lab = p.h + say('m') + '/' + Math.round(p.h*3.281) + 'ft';
      ctx.font = '700 13px ' + MONO; const tw = ctx.measureText(txt).width;
      ctx.font = '600 9.5px ' + MONO; const uw = ctx.measureText(un).width, lw = ctx.measureText(lab).width;
      const w = Math.max(22 + tw + uw, lw + 10) + 6, h = 30, x = right - w;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 1;
      ctx.fillStyle = speedColor(p.v); roundRect(x, y - h/2, w, h, 9); ctx.fill(); ctx.restore();
      // lower band carries the height in metres and feet
      ctx.save(); roundRect(x, y - h/2, w, h, 9); ctx.clip();
      ctx.fillStyle = 'rgba(13,27,42,0.8)'; ctx.fillRect(x, y + 2, w, h/2); ctx.restore();
      // same rule as the table: the arrow points where the wind blows to, north is up
      ctx.save(); ctx.translate(x + 11, y - 7); ctx.rotate((p.d + 180)*Math.PI/180);
      ctx.strokeStyle = '#0d1b2a'; ctx.fillStyle = '#0d1b2a'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(0, -2.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(3.4, -1.2); ctx.lineTo(-3.4, -1.2); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#0d1b2a'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.font = '700 13px ' + MONO; ctx.fillText(txt, x + 21, y - 7);
      ctx.font = '600 9.5px ' + MONO; ctx.fillText(un, x + 21 + tw, y - 6.5);
      ctx.fillStyle = '#ffffff'; ctx.fillText(lab, x + (w - lw)/2, y + 8.5);
    });
  }
  function roundRect(x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }


  let lastW = 0;
  new ResizeObserver(() => { const w = cv.parentElement.clientWidth; if (w === lastW) return; lastW = w; resize(); if (reduce) draw(performance.now()); }).observe(cv.parentElement);
  function loop(now){ draw(now); requestAnimationFrame(loop); }
  if (!reduce) requestAnimationFrame(loop);
  return {set};
})();

applyLang();
load();
if (state.place.geo || !store.get('place', null)) locate(true);
// pull the page down from the very top to refresh: back to now, fresh forecast and position
(() => {
  const el = $('ptr'), arrow = el.firstChild;
  let y0 = null, pull = 0, busy = false;
  const show = d => { el.style.transform = 'translateY(' + (Math.min(d, 90) - 50) + 'px)'; el.style.opacity = Math.min(1, d/60); arrow.style.transform = 'rotate(' + d*3 + 'deg)'; };
  addEventListener('touchstart', e => { y0 = !busy && scrollY <= 0 && $('search').hidden ? e.touches[0].clientY : null; pull = 0; }, {passive:true});
  addEventListener('touchmove', e => { if (y0 == null) return; pull = Math.max(0, (e.touches[0].clientY - y0)*0.55); show(pull); }, {passive:true});
  addEventListener('touchend', async () => {
    if (y0 == null) return; y0 = null;
    if (pull < 65){ el.style.transition = 'transform .2s, opacity .2s'; show(0); setTimeout(() => el.style.transition = '', 220); return; }
    busy = true; show(70); el.classList.add('spin');
    state.day = 0; state.hour = null;
    await load(); if (state.place.geo) locate(true);
    el.classList.remove('spin'); el.style.transition = 'transform .2s, opacity .2s'; show(0); setTimeout(() => el.style.transition = '', 220); busy = false;
  });
})();
// back from the background after a while: jump to now and fetch a fresh forecast (and position)
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  if (Date.now() - hiddenAt < 5*60*1000) return;
  state.day = 0; state.hour = null;
  load(); if (state.place.geo) locate(true);
});
})();
</script>

<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
